<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de RPG</title>
    <link rel="stylesheet" href="mesa.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mesa-container">
        <!-- Anel de Jogadores (Agora no Topo) -->
        <div class="players-ring" id="players-ring">
            <!-- Jogadores serão renderizados aqui via JS -->
        </div>

        <!-- Mesa Central -->
        <div class="mesa-central">
            <h2>MESA CENTRAL</h2>
            <div class="mesa-content">
                <div class="dice-logs" id="dice-logs">
                    <p class="mesa-status">Aguardando rolagens...</p>
                </div>
            </div>

            </div>
        </div>
        
        <!-- Removido o panel antigo do spotify daqui -->

    <!-- Painel do Jogador Atual (controles pessoais) -->
    <div id="player-panel" class="player-panel hidden">
        <h3 id="current-player-name">Meu Personagem</h3>
        
        <div class="player-status-bar">
            <div class="status-bar-item hp">
                <span class="label">VIDA</span>
                <button class="btn-sub" data-stat="vida">-</button>
                <span class="value" id="hp-value">0/0</span>
                <button class="btn-add" data-stat="vida">+</button>
            </div>
            <div class="status-bar-item est">
                <span class="label">EST</span>
                <button class="btn-sub" data-stat="estamina">-</button>
                <span class="value" id="est-value">0/0</span>
                <button class="btn-add" data-stat="estamina">+</button>
            </div>
        </div>

        <div class="player-rolls">
            <h4>Rolagens (1D20 + Atributo)</h4>
            <div class="rolls-grid">
                <button class="btn-roll-attr" data-attr="forca">Força</button>
                <button class="btn-roll-attr" data-attr="destreza">Destreza</button>
                <button class="btn-roll-attr" data-attr="mira">Mira</button>
                <button class="btn-roll-attr" data-attr="agilidade">Agilidade</button>
                <button class="btn-roll-attr" data-attr="carisma">Carisma</button>
                <button class="btn-roll-attr" data-attr="intuicao">Intuição</button>
            </div>
            
            <h4 style="margin-top: 15px; color: #ff3366;">Rolagens de Dano</h4>
            <div class="rolls-grid">
                <button class="btn-roll-dano" id="btn-dano-fisico">Dano Físico</button>
                <button class="btn-roll-dano" id="btn-dano-mira">Dano Mira</button>
            </div>
        </div>
    </div>

    <!-- Modal de Informações do Personagem -->
    <div id="player-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-header">
                <img id="modal-foto" src="" alt="Foto" class="modal-foto-lg">
                <div class="modal-header-info">
                    <h2 id="modal-nome">Nome do Personagem</h2>
                    <span class="player-badge">PLAYER</span>
                </div>
            </div>
            <div class="modal-body">
                <div class="info-section">
                    <h3>História</h3>
                    <p id="modal-historia"></p>
                </div>
                <div class="info-section">
                    <h3>Inventário</h3>
                    <p id="modal-inventario"></p>
                </div>
                <div class="atributos-section">
                    <h3>Status</h3>
                    <ul id="modal-status" class="atributos-list">
                        <!-- Status -->
                    </ul>
                </div>
                <div class="atributos-section">
                    <h3>Atributos</h3>
                    <ul id="modal-atributos" class="atributos-list">
                        <!-- Atributos -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Update de Status -->
    <div id="modal-status-update" class="modal hidden">
        <div class="modal-content" style="max-width: 300px; text-align: center;">
            <h2 id="modal-status-title" style="color: #00d2ff; margin-bottom: 15px;">Atualizar</h2>
            <input type="number" id="modal-status-input" style="width: 100%; padding: 10px; margin-bottom: 20px; text-align: center; font-size: 1.2rem; background: rgba(0,0,0,0.5); color: white; border: 1px solid #00d2ff; border-radius: 5px;" min="1">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="btn-status-confirm" class="btn-primary" style="flex: 1;">Confirmar</button>
                <button id="btn-status-cancel" class="btn-secondary" style="flex: 1; background: #333; border: 1px solid var(--border-color); color: white; cursor: pointer; border-radius: 5px; font-family: 'Orbitron', sans-serif;">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Botão Flutuante do Spotify -->
    <button id="btn-spotify-toggle" style="position: fixed; top: 20px; left: 20px; z-index: 100; background: #1db954; border: 2px solid #000; border-radius: 50%; width: 60px; height: 60px; font-size: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; transition: transform 0.2s;">
        🎵
    </button>

    <!-- Modal do Spotify -->
    <div id="modal-spotify" class="modal hidden">
        <div class="modal-content" style="max-width: 400px; text-align: center; border: 1px solid #1db954; box-shadow: 0 0 30px rgba(29, 185, 84, 0.2);">
            <h2 style="color: #1db954; font-family: 'Orbitron', sans-serif; margin-bottom: 20px;">Spotify Jam</h2>
            <div class="spotify-controls" style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
                <input type="text" id="spotify-link-input" placeholder="Cole o link..." style="flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #1db954; background: rgba(0,0,0,0.5); color: white; font-family: 'Rajdhani', sans-serif;">
                <button id="btn-sync-spotify" class="btn-success" style="background: #1db954; border: none; padding: 10px 20px; border-radius: 5px; color: black; font-weight: bold; cursor: pointer; font-family: 'Orbitron', sans-serif;">Sync</button>
            </div>
            <div id="spotify-embed-container" style="width: 100%; min-height: 152px; border-radius: 12px; overflow: hidden; margin-bottom: 20px;">
                <!-- O iframe do Spotify será renderizado aqui -->
            </div>
            <button id="btn-spotify-close" class="btn-secondary" style="padding: 10px 30px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; cursor: pointer; font-family: 'Orbitron', sans-serif;">Fechar</button>
        </div>
    </div>

    <script type="module" src="mesa.js"></script>
</body>
</html>
