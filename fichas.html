<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichas de Jogadores</title>
    <link rel="stylesheet" href="fichas.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0;">
    <div id="password-screen" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #0a0a0a; color: #fff; font-family: 'Courier New', Courier, monospace;">
        <h2 style="color: #00d2ff; text-shadow: 0 0 10px #00d2ff; margin-bottom: 30px; font-size: 2rem;">Acesso ao Sistema de Fichas</h2>
        <input type="password" id="ficha-password" placeholder="Digite a senha..." style="padding: 15px; margin-bottom: 20px; width: 250px; background: rgba(0,210,255,0.05); border: 1px solid #00d2ff; color: white; outline: none; font-size: 1.1rem; text-align: center;">
        <button id="btn-login-fichas" class="btn-success" style="padding: 10px 40px; font-size: 1.2rem; cursor: pointer;">ACESSAR</button>
        <p id="password-error" style="color: #ff3366; margin-top: 15px; display: none; text-shadow: 0 0 5px #ff3366;">Acesso negado. Senha incorreta.</p>
    </div>

    <div id="fichas-content" style="display: none;">
        <div class="fichas-container">
        <!-- Sidebar para lista de fichas -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Jogadores</h2>
                <button id="btn-nova-ficha" class="btn-primary">+ Nova Ficha</button>
            </div>
            <ul id="lista-fichas" class="lista-fichas">
                <!-- Fichas serão carregadas aqui -->
            </ul>
        </aside>

        <!-- Área principal de edição -->
        <main class="main-content">
            <div id="ficha-editor" class="ficha-editor hidden">
                <header class="editor-header">
                    <h2>Detalhes da Ficha</h2>
                    <div class="header-actions">
                        <button id="btn-salvar" class="btn-success">Salvar Ficha</button>
                        <button id="btn-excluir" class="btn-danger">Excluir</button>
                    </div>
                </header>

                <div class="editor-body">
                    <!-- Informações Básicas -->
                    <section class="info-section">
                        <div class="form-group">
                            <label for="ficha-nome">Nome</label>
                            <input type="text" id="ficha-nome" placeholder="Nome do personagem..." autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="ficha-foto">URL da Foto</label>
                            <input type="text" id="ficha-foto" placeholder="Link da imagem do personagem..." autocomplete="off">
                        </div>
                        <div class="form-group checkbox-group">
                            <label for="ficha-is-player">
                                <input type="checkbox" id="ficha-is-player"> Tag: Player
                            </label>
                            <label for="ficha-is-master" style="margin-left: 15px;">
                                <input type="checkbox" id="ficha-is-master"> Tag: Mestre (Não joga)
                            </label>
                        </div>
                        <div id="login-fields" class="hidden">
                            <div class="form-group">
                                <label for="ficha-login">Login</label>
                                <input type="text" id="ficha-login" placeholder="Login para acessar a ficha" autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label for="ficha-senha">Senha</label>
                                <input type="password" id="ficha-senha" placeholder="Senha da ficha" autocomplete="off">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="ficha-historia">História</label>
                            <textarea id="ficha-historia" rows="5" placeholder="História do personagem..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="ficha-inventario">Inventário</label>
                            <textarea id="ficha-inventario" rows="5" placeholder="Itens e equipamentos..."></textarea>
                        </div>
                    </section>

                    <!-- Status -->
                    <section class="status-section">
                        <h3>Status (Recursos)</h3>
                        <div class="status-grid">
                            <div class="status-item">
                                <label>Vida (Atual / Máx)</label>
                                <div class="status-inputs">
                                    <input type="number" id="status-vida-atual" value="0">
                                    <span>/</span>
                                    <input type="number" id="status-vida-max" value="0" readonly title="Calculado automaticamente: 50 + (Resistênciax10) + (Forçax2)">
                                </div>
                            </div>
                            <div class="status-item">
                                <label>Estamina (Atual / Máx)</label>
                                <div class="status-inputs">
                                    <input type="number" id="status-estamina-atual" value="0">
                                    <span>/</span>
                                    <input type="number" id="status-estamina-max" value="0" readonly title="Calculado automaticamente: Estamina x 2">
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Atributos -->
                    <section class="atributos-section">
                        <h3>Atributos</h3>
                        <table class="atributos-table">
                            <thead>
                                <tr>
                                    <th>Atributo</th>
                                    <th>Nível</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Força</td>
                                    <td><input type="number" id="attr-forca" min="0" value="0"></td>
                                </tr>
                                <tr>
                                    <td>Destreza</td>
                                    <td><input type="number" id="attr-destreza" min="0" value="0"></td>
                                </tr>
                                <tr>
                                    <td>Mira</td>
                                    <td><input type="number" id="attr-mira" min="0" value="0"></td>
                                </tr>
                                <tr>
                                    <td>Resistência</td>
                                    <td><input type="number" id="attr-resistencia" min="0" value="0"></td>
                                </tr>
                                <tr>
                                    <td>Agilidade</td>
                                    <td><input type="number" id="attr-agilidade" min="0" value="0"></td>
                                </tr>
                                <tr>
                                    <td>Carisma</td>
                                    <td><input type="number" id="attr-carisma" min="0" value="0"></td>
                                </tr>
                                <tr>
                                    <td>Intuição</td>
                                    <td><input type="number" id="attr-intuicao" min="0" value="0"></td>
                                </tr>
                                <tr>
                                    <td>Estamina</td>
                                    <td><input type="number" id="attr-estamina" min="0" value="0"></td>
                                </tr>
                                <tr>
                                    <td>Arma de Fogo (Mira)</td>
                                    <td>
                                        <select id="attr-arma-nivel" style="width: 100%; padding: 5px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); color: white;">
                                            <option value="-1">Sem Arma</option>
                                            <option value="1">Ranking I (Dano Fixo: 20)</option>
                                            <option value="2">Ranking II (Dano Fixo: 35)</option>
                                            <option value="3">Ranking III (Dano Fixo: 50)</option>
                                            <option value="4">Ranking IV (Dano Fixo: 70)</option>
                                            <option value="5">Ranking V (Dano Fixo: 90)</option>
                                            <option value="6">Ranking VI (Dano Fixo: 115)</option>
                                            <option value="7">Ranking VII (Dano Fixo: 140)</option>
                                            <option value="8">Ranking VIII (Dano Fixo: 170)</option>
                                            <option value="9">Ranking IX (Dano Fixo: 205)</option>
                                            <option value="10">Ranking X (Dano Fixo: 245)</option>
                                        </select>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </section>
                </div>
            </div>
            
            <div id="empty-state" class="empty-state">
                <p>Selecione uma ficha na lista ou crie uma nova para começar.</p>
            </div>
        </main>
    </div>
    </div>

    <script type="module" src="fichas.js"></script>
</body>
</html>
