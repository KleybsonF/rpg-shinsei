<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Administração - Unity Space</title>
  <link rel="stylesheet" href="admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="space">
    <div id="stars"></div>
    <div id="nebula"></div>
  </div>

  <div id="admin-container">
    <header>
      <h1>ADMINISTRAÇÃO <span>UNITY SPACE</span></h1>
      <nav>
        <button id="nav-planets" class="active">Mundos</button>
        <button id="nav-bounties">Alvos Procurados</button>
      </nav>
    </header>

    <div class="content">
      <aside class="list-section">
        <input type="text" id="search-input" placeholder="Buscar...">
        <div id="item-list"></div>
      </aside>

      <main class="editor-section">
        <h2 id="editor-title">Selecione um item para editar</h2>
        
        <form id="editor-form" style="display: none;">
          <input type="hidden" id="edit-id">
          <input type="hidden" id="edit-type">
          
          <div class="form-group">
            <label>Nome / Título</label>
            <input type="text" id="edit-name">
          </div>

          <div class="form-group" id="group-wanted" style="margin-bottom: 20px;">
            <label style="display: flex; align-items: center; cursor: pointer; gap: 10px; font-weight: bold; color: #ff5e00;">
              <input type="checkbox" id="edit-wanted" style="width: 20px; height: 20px; accent-color: #ff5e00; cursor: pointer;">
              WANTED (Procurado)
            </label>
            <small style="color: #888; font-size: 11px;">Se desmarcado, o alvo constará como Eliminado (X vermelho).</small>
          </div>

          <div class="form-group" id="group-power">
            <label>Poder (Apenas Procurados)</label>
            <input type="text" id="edit-power">
          </div>

          <div class="form-group" id="group-aparencia">
            <label>Aparência (Apenas Procurados)</label>
            <input type="text" id="edit-aparencia">
          </div>

          <div class="form-group" id="group-personalidade">
            <label>Personalidade (Apenas Procurados)</label>
            <input type="text" id="edit-personalidade">
          </div>

          <div class="form-group" id="group-lastseen">
            <label>Visto por Último (Apenas Procurados)</label>
            <div style="display: flex; gap: 10px;">
              <select id="edit-lastseen" style="flex: 1; padding: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; background: rgba(0, 0, 0, 0.5); color: #fff;"></select>
              <button type="button" id="btn-random-planet" style="padding: 0 1rem; border: none; background: #6a2cc9; color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold;">Randomizar</button>
            </div>
          </div>

          <div class="form-group">
            <label>Descrição</label>
            <textarea id="edit-desc" rows="4"></textarea>
          </div>
          
          <div class="form-group">
            <label>Imagem 1:1</label>
            <div class="image-upload" id="image-upload-box">
              <img id="image-preview" src="" style="display:none;">
              <span id="upload-text">Clique ou arraste uma foto 1:1 aqui</span>
              <input type="file" id="image-input" accept="image/*">
            </div>
            <input type="hidden" id="edit-image-url">
          </div>
          
          <button type="submit" class="btn-save">Salvar Alterações</button>
        </form>
      </main>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
