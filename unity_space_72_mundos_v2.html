<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNITY SPACE — Atlas 72</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{background:
radial-gradient(ellipse at 58% 48%,rgba(80,80,130,.18),transparent 33%),
radial-gradient(ellipse at 78% 65%,rgba(80,30,130,.15),transparent 30%),
radial-gradient(ellipse at 20% 78%,rgba(30,100,130,.12),transparent 30%),#04060b}
#stars{position:fixed;inset:0;opacity:.65;background-image:
radial-gradient(1px 1px at 8% 12%,#fff,transparent),radial-gradient(1px 1px at 18% 78%,#fff,transparent),
radial-gradient(1px 1px at 28% 24%,#fff,transparent),radial-gradient(1px 1px at 37% 83%,#fff,transparent),
radial-gradient(1px 1px at 48% 14%,#fff,transparent),radial-gradient(1px 1px at 58% 71%,#fff,transparent),
radial-gradient(1px 1px at 69% 28%,#fff,transparent),radial-gradient(1px 1px at 79% 84%,#fff,transparent),
radial-gradient(1px 1px at 91% 18%,#fff,transparent),radial-gradient(1px 1px at 95% 62%,#fff,transparent);
background-size:150px 130px}
#nebula{position:fixed;inset:-15%;filter:blur(18px);opacity:.45;background:
linear-gradient(118deg,transparent 5%,rgba(52,72,150,.16) 23%,transparent 39%),
linear-gradient(72deg,transparent 43%,rgba(150,45,150,.13) 56%,transparent 75%),
linear-gradient(155deg,transparent 38%,rgba(40,130,170,.11) 51%,transparent 70%);pointer-events:none}
#viewport{position:absolute;inset:0;overflow:hidden;cursor:grab}
#viewport.drag{cursor:grabbing}
#world{position:absolute;width:1700px;height:1050px;transform-origin:0 0}
#header{position:fixed;z-index:20;left:45px;top:28px;pointer-events:none}
#header h1{margin:0;font-size:40px;font-weight:400;letter-spacing:1px}
#header span{font-size:11px;color:#a9b3c6;letter-spacing:4px}
svg{width:100%;height:100%;overflow:visible}
.route{fill:none;stroke:#e9eef7;stroke-width:2.5;opacity:.72;filter:drop-shadow(0 0 2px rgba(255,255,255,.3));pointer-events:none}
.route.faint{opacity:.52}
.cluster{cursor:pointer;transition:.2s}
.cluster circle{stroke-width:1.7;opacity:.92}
.cluster:hover circle{filter:brightness(1.25)}
.cluster-name{font-size:25px;letter-spacing:2px;fill:#fff;pointer-events:none}
.cluster-count{font-size:11px;letter-spacing:3px;fill:#bdc7d6;pointer-events:none}
.planet{cursor:pointer}
.planet:hover .body{filter:brightness(1.35) drop-shadow(0 0 7px rgba(255,255,255,.45))}
.body{stroke:rgba(255,255,255,.58);stroke-width:1.2}
.ptext{font-size:13px;fill:#f2f5fb;paint-order:stroke;stroke:#05070d;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.small .ptext{font-size:11px}
.selected .body{stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 12px #fff)}
#controls{position:fixed;z-index:30;right:22px;top:20px;display:flex;gap:7px}
button,input{background:rgba(7,11,19,.82);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:9px 11px}
button{cursor:pointer}button:hover{background:rgba(25,32,48,.95)}
input{width:230px;outline:none}
#info{position:fixed;right:22px;top:76px;width:330px;max-height:calc(100vh - 98px);overflow:auto;z-index:40;background:rgba(7,10,18,.94);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:20px;backdrop-filter:blur(16px);display:none;box-shadow:0 20px 70px #000}
#info.show{display:block}
#close{float:right;border:0;background:none;font-size:22px;padding:0;color:#9aa7b9}
.kicker{color:#8997ad;font-size:10px;letter-spacing:2px}
#info h2{margin:6px 0 3px;font-size:28px;font-weight:500}
#info .sub{color:#aeb8c9;font-size:12px;margin-bottom:18px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px}
.row b{font-weight:500}
#desc{color:#b8c2d1;font-size:13px;line-height:1.55;margin-top:16px}
#galaxyInfo{position:fixed;left:30px;bottom:25px;z-index:20;width:290px;padding:15px;background:rgba(7,10,18,.78);border:1px solid rgba(255,255,255,.13);border-radius:10px;backdrop-filter:blur(12px)}
#galaxyInfo h3{margin:0 0 5px;font-size:17px;font-weight:500}
#galaxyInfo p{margin:0;color:#9da9bb;font-size:11px;line-height:1.5}
#hint{position:fixed;bottom:29px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:1px;color:#6f7d93;z-index:10}
@media(max-width:700px){#header{left:18px;top:15px}#header h1{font-size:25px}#controls{left:15px;right:15px;top:52px}input{flex:1;width:auto}#info{left:12px;right:12px;width:auto;top:100px}#galaxyInfo{display:none}}
</style>
</head>
<body>
<div id="stars"></div><div id="nebula"></div>
<div id="header"><h1>UNITY SPACE</h1><span>CELESTIAL NETWORK · 72 WORLDS</span></div>
<div id="controls"><input id="search" placeholder="Buscar um mundo..."><button id="home">VISÃO GERAL</button><button id="minus">−</button><button id="plus">+</button></div>
<div id="viewport"><div id="world"><svg id="map" viewBox="0 0 1700 1050"></svg></div></div>
<div id="galaxyInfo"><h3 id="giTitle">Unity Space</h3><p id="giText">Uma rede de seis grandes aglomerados conectados por rotas interestelares. Clique em qualquer planeta ou região para explorar.</p></div>
<div id="hint">ARRASTE · ZOOM · CLIQUE NOS MUNDOS</div>
<div id="info"><button id="close">×</button><div class="kicker" id="icode"></div><h2 id="iname"></h2><div class="sub" id="isub"></div><div id="rows"></div><div id="desc"></div></div>
<script>
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("map");
const galaxyData=[
["UNITY SPACE","Unity Space","rgba(120,140,170,.24)","#8c98aa",330,300,"O núcleo de rotas onde diferentes civilizações se encontram."],
["ORWMON","ORWMON","#5aa5d6","#62b7ee",820,230,"Um aglomerado de mundos antigos e rotas de longa distância."],
["ENGAI CLUSTER","ENGAI CLUSTER","#b92f3d","#ed4b57",1400,225,"Uma região distante, isolada das grandes rotas."],
["NOVII","NOVII","#9b8177","#c9a998",850,475,"Mundos densamente conectados e fundamentais para o comércio."],
["MAZHAAT","MAZHAAT","#4b8b21","#77b94b",370,775,"Um aglomerado verde, rico em vida e culturas independentes."],
["TELLUS","TELLUS","#aa9c25","#d7c83e",1260,700,"A maior concentração de mundos habitáveis conhecida."],
["EMION","EMION","#789d50","#9bc66a",735,760,"Um pequeno sistema de passagem entre grandes regiões."],
["ELIKAR","ELIKAR","#7133ba","#9b5cf1",925,925,"Um mundo isolado ligado diretamente a múltiplos setores."]
];

const descriptions={
"Bantos":"Um mundo antigo cercado por colônias menores e rotas comerciais.",
"Zebilia":"Centro de navegação do aglomerado Orwmon.",
"Photor":"Um planeta azul coberto por oceanos e tempestades permanentes.",
"Carak":"Pequeno mundo mineral usado como entreposto.",
"Eluridan":"Um planeta isolado, conectado por uma única rota de longa distância.",
"Kaitos":"Um dos mundos mais populosos do Unity Space.",
"Sulis":"Planeta de mares e continentes fragmentados.",
"Khorus":"Mundo fértil conhecido por suas extensas planícies.",
"Morion":"Pequeno satélite habitado.",
"Alaspin":"Planeta de clima temperado e cidades costeiras.",
"Zelos":"Mundo rochoso rico em minerais.",
"Cordia":"Planeta marcado por crateras e antigas estruturas.",
"Thalia":"Um dos principais nós de transporte da região Novii.",
"Vulia":"Mundo pequeno com atmosfera densa.",
"Tricadia":"Planeta agrícola de três grandes continentes.",
"Argos":"Mundo escuro com cidades subterrâneas.",
"Anubis":"Planeta desértico com antigas ruínas.",
"Tinix":"Pequeno mundo gelado.",
"Liana":"Mundo oceânico com grandes arquipélagos.",
"Midworld":"Entreposto central de várias rotas.",
"Akafar":"Capital cultural de Mazhaat.",
"Gorean":"Planeta de savanas e grandes cidades.",
"Sakina":"Mundo montanhoso.",
"Thryy":"Pequeno planeta frio.",
"Yemaya":"Mundo de oceanos rasos.",
"Neomey":"Planeta coberto por florestas.",
"Pitar":"Mundo de desertos e cidades subterrâneas.",
"Numina":"Planeta temperado com duas luas.",
"Willow-Wane":"Mundo de florestas e ruínas.",
"Hivehom":"Planeta densamente povoado por colmeias urbanas.",
"Vakshaa":"Mundo pequeno de mineração.",
"Tellus":"Um dos centros políticos e populacionais do Unity Space.",
"Deneb":"Planeta de atmosfera azulada.",
"Taisho":"Mundo tecnológico com cidades brilhantes.",
"Moth":"Pequeno planeta rochoso.",
"Corrris":"Mundo tropical.",
"Sirius":"Planeta de desertos claros.",
"Eridani":"Mundo oceânico.",
"Terra":"Um planeta central, antigo e densamente habitado.",
"Barion":"Mundo mineral.",
"Centauri":"Planeta comercial.",
"Aquaris":"Mundo quase totalmente oceânico.",
"Rihan":"Pequeno satélite habitado.",
"Crucis":"Mundo gelado.",
"Cruxor Prime":"Planeta remoto no limite do mapa.",
"MMM":"Um pequeno sistema artificial de trânsito.",
"Elikar":"Um planeta escuro e isolado, cercado de mistérios."
};

// Manual layout inspired by the reference: uneven clusters, varying planet sizes.
const layouts={
"UNITY SPACE":[["Khorus",250,250,22],["Sulis",135,285,25],["Kaitos",255,320,42],["Zelos",130,365,17],["Cordia",205,420,26],["Morion",335,330,16],["Alaspin",285,410,22]],
"ORWMON":[["Bantos",790,105,20],["Zebilia",855,145,29],["Photor",820,225,23],["Carak",900,175,13]],
"ENGAI CLUSTER":[["Eluridan",1405,145,24]],
"NOVII":[["Thalia",785,425,32],["Vulia",880,450,15],["Tricadia",735,505,18],["Argos",820,510,19],["Anubis",900,540,29],["Tinix",720,590,17],["Liana",825,610,17],["Midworld",965,625,25]],
"MAZHAAT":[["Sakina",105,650,18],["Akafar",300,685,25],["Gorean",470,670,20],["Thryy",45,735,12],["Yemaya",280,760,16],["Neomey",350,735,18],["Pitar",455,785,29],["Hivehom",125,805,34],["Vakshaa",155,875,14],["Numina",380,865,23],["Willow-Wane",270,920,27]],
"EMION":[["MMM",710,790,25]],
"TELLUS":[["Deneb",1260,515,18],["Taisho",1180,625,25],["Corrris",1370,590,21],["Sirius",1440,635,17],["Moth",1305,645,16],["Eridani",1450,735,20],["Terra",1340,735,29],["Barion",1245,755,19],["Centauri",1275,840,20],["Aquaris",1190,890,18],["Rihan",1430,855,13],["Crucis",1370,900,15],["Mordis",1135,860,16],["Avalon",1110,690,14]],
"ELIKAR":[["Elikar",925,930,28]]
};

const colors=["#8fb7d9","#6f95c7","#8abf73","#d1ad74","#a978c4","#78c5c8","#c28b72","#9ca4b1"];
function el(tag,attrs={},parent=svg){const x=document.createElementNS(NS,tag);for(const k in attrs)x.setAttribute(k,attrs[k]);parent.appendChild(x);return x}
function line(a,b,curve=0){return `M ${a[0]} ${a[1]} Q ${(a[0]+b[0])/2} ${(a[1]+b[1])/2+curve} ${b[0]} ${b[1]}`}
const defs=el("defs");
function gradient(id,c){
 const g=el("radialGradient",{id},defs);
 el("stop",{offset:"0%","stop-color":"#fff","stop-opacity":".95"},g);
 el("stop",{offset:"30%","stop-color":c},g);
 el("stop",{offset:"100%","stop-color":"#111","stop-opacity":".9"},g);
}
colors.forEach((c,i)=>gradient("g"+i,c));

const clusterLayer=el("g"), routes=el("g"), planetLayer=el("g");
const planets=[];
let id=0;

// Cluster circles
galaxyData.forEach((g,i)=>{
 if(i===0)return;
 const [name,display,color,stroke,x,y]=g;
 const r=(name==="ENGAI CLUSTER"?90:name==="EMION"?95:name==="ELIKAR"?80:175);
 const c=el("circle",{cx:x,cy:y,r,fill:color,stroke, "fill-opacity":".25","stroke-opacity":".5","stroke-width":2.2},clusterLayer);
 c.classList.add("cluster");
 c.onclick=()=>focus(x,y,.9);
 const t=el("text",{x,y:y-r+30,"text-anchor":"middle",class:"cluster-name"},clusterLayer);t.textContent=display;
 const n=el("text",{x,y:y-r+48,"text-anchor":"middle",class:"cluster-count"},clusterLayer);n.textContent=(layouts[name]?.length||1)+" WORLDS";
});

// routes within clusters
Object.entries(layouts).forEach(([cluster,arr])=>{
 for(let i=0;i<arr.length-1;i++){
   const a=arr[i],b=arr[i+1];
   const p=el("path",{d:line([a[1],a[2]],[b[1],b[2]],(i%2?18:-18)),class:"route"},routes);
 }
 if(arr.length>4){
   for(let i=0;i<arr.length-3;i+=2){
     const a=arr[i],b=arr[i+3];
     el("path",{d:line([a[1],a[2]],[b[1],b[2]],25),class:"route faint"},routes);
   }
 }
});

// major inter-cluster routes, deliberately curved
const links=[
 [[350,320],[790,145],-70],[[855,175],[785,425],30],[[900,540],[1110,690],-25],
 [[1110,690],[1340,735],35],[[1340,735],[1405,145],-120],[[470,785],[710,790],-30],
 [[710,790],[925,930],35],[[270,920],[925,930],-90],[[380,685],[785,425],-90],
 [[965,625],[1260,515],-50],[[900,540],[710,790],-70],[[285,410],[300,685],20]
];
links.forEach(([a,b,c])=>el("path",{d:line(a,b,c),class:"route"},routes));

// planets
Object.entries(layouts).forEach(([cluster,arr],ci)=>{
 arr.forEach((d,i)=>{
   const [name,x,y,r]=d; const p={id:++id,name,x,y,r,cluster,type:["Habitável","Mineral","Oceânico","Industrial"][i%4]};
   planets.push(p);
   const g=el("g",{class:"planet",tabindex:"0"},planetLayer);
   const grad="g"+((i+ci*2)%colors.length);
   const circle=el("circle",{cx:x,cy:y,r,fill:`url(#${grad})`,class:"body"},g);
   // tiny orbit-like highlight for larger worlds
   if(r>=24)el("ellipse",{cx:x,cy:y,rx:r+4,ry:r*.38,transform:`rotate(-18 ${x} ${y})`,fill:"none",stroke:"rgba(255,255,255,.18)","stroke-width":1},g);
   const tx=x+r+8, ty=y+4;
   const text=el("text",{x:tx,y:ty,class:"ptext"},g);text.textContent=name;
   p.el=g;
   g.onclick=e=>{e.stopPropagation();show(p)};
 });
});

function show(p){
 document.querySelectorAll(".selected").forEach(e=>e.classList.remove("selected"));p.el.classList.add("selected");
 document.getElementById("icode").textContent=`WORLD ${String(p.id).padStart(2,"0")} / 72 · ${p.cluster}`;
 document.getElementById("iname").textContent=p.name;
 document.getElementById("isub").textContent=`${p.cluster} · ${p.type}`;
 document.getElementById("rows").innerHTML=
 `<div class="row"><span>Classificação</span><b>${p.type}</b></div>
  <div class="row"><span>Setor</span><b>${p.cluster}</b></div>
  <div class="row"><span>Coordenadas</span><b>${Math.round(p.x)} : ${Math.round(p.y)}</b></div>
  <div class="row"><span>Status</span><b>Cartografado</b></div>`;
 document.getElementById("desc").textContent=descriptions[p.name]||"Mundo catalogado no atlas do Unity Space.";
 document.getElementById("info").classList.add("show");
 const gd=galaxyData.find(g=>g[0]===p.cluster)||galaxyData[0];
 document.getElementById("giTitle").textContent=gd[1];
 document.getElementById("giText").textContent=gd[6]||"Região catalogada.";
}
document.getElementById("close").onclick=()=>document.getElementById("info").classList.remove("show");

let scale=.82,tx=0,ty=0,drag=false,sx,sy,ox,oy;
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function center(){
 scale=.82;tx=(innerWidth-1700*scale)/2;ty=(innerHeight-1050*scale)/2;apply()
}
function focus(x,y,s=.9){scale=s;tx=innerWidth/2-x*scale;ty=innerHeight/2-y*scale;apply()}
document.getElementById("home").onclick=center;
document.getElementById("plus").onclick=()=>{scale=Math.min(2,scale*1.18);apply()};
document.getElementById("minus").onclick=()=>{scale=Math.max(.35,scale/1.18);apply()};
viewport.addEventListener("wheel",e=>{
 e.preventDefault();const rect=viewport.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
 const old=scale,n=Math.max(.35,Math.min(2,old*(e.deltaY<0?1.12:.89)));
 tx=mx-(mx-tx)*(n/old);ty=my-(my-ty)*(n/old);scale=n;apply()
},{passive:false});
viewport.addEventListener("pointerdown",e=>{drag=true;viewport.classList.add("drag");sx=e.clientX;sy=e.clientY;ox=tx;oy=ty;viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener("pointermove",e=>{if(drag){tx=ox+e.clientX-sx;ty=oy+e.clientY-sy;apply()}});
viewport.addEventListener("pointerup",()=>{drag=false;viewport.classList.remove("drag")});
document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.toLowerCase().trim();
 planets.forEach(p=>p.el.style.opacity=(!q||(`${p.name} ${p.cluster}`.toLowerCase().includes(q)))?"1":".08");
 if(q){const p=planets.find(p=>`${p.name} ${p.cluster}`.toLowerCase().includes(q));if(p){show(p);focus(p.x,p.y,1.15)}}
});
center();
</script>
</body>
</html>
